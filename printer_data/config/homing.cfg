[homing_override]
gcode:
  # Move 5 up, just in case (this is our safety zhop, this needs 'set_position_z: 0' below)

  # 1. Lower current for X and Y (change 0.400 to your desired homing current)
    #SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.49
    #SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.49
  STATUS_HOMING
  UNDERGLOW_HOMING
  G91 ; set relative positioning
  G0 Z5 F1000 ; 5 up zhop
  {% if not rawparams or 'Y' in rawparams %}
    {action_respond_info('Homing Y')}
    G28 Y
    G90 ; set absolute positioning
    G0 Y179 F6000 ; return to center                                #Y177.5
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'X' in rawparams %}
    {action_respond_info('Homing X')}
    G28 X
    G90 ; set absolute positioning
    G0 Y179 F6000 ; return to center
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'Z' in rawparams %}
    {action_respond_info('Homing Z')}
    G90 ; set absolute positioning
    G0 X179 Y182.50 F6000 ; return to center, please add your offsets manually if you want to

    # 4. Restore high current for printing (set to your normal RUN_CURRENT)
    #SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.2
    #SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.2
    
  #   Attach_Probe
    # SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.4
    # SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.4
    # SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.4
    # SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT=0.4
  
    G28 Z F1000
  #  G0 X179 Y182 F4000
  #   G28 Z0
  #   G0 Z20 F4000
  #   G90
  #   G0 X42.00 F4000
  #   G0 Y357
  #   G0 X179 F4000
  #   G0 Y182 F4000
  #   G90
  # #   Dock_Probe
    G0 Z10 F1000 ; move to z10 before probe
    # G0 Z2 F1000 ; move to z2 to finish
    # M400 ; Wait for move to finish
    # PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1
    # G0 Z5 F1000 ; 5mm up
    # M400 ; Wait for move to finish
    # SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.566 
    # SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.566 
    # SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.566 
    # SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT=0.566 
    
  {% endif %}
  G90 ; set absolute positioning
    STATUS_READY
    UNDERGLOW_STANDBY
axes: xyz
set_position_z: 0 # This forces the z position to be at 0 when we start homing, so we can move the Z up before homing.