# Happy Hare MMU includes (should be near top of file)

# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

# See docs/Config_Reference.md for a description of parameters.

[include shell_command.cfg]
[include mainsail.cfg]
[include timelapse.cfg]
[include Addons/Toolhead_Led.cfg]
[include Addons/underglow.cfg]
[include Addons/./KAMP_LiTE/*.cfg]
[include Addons/input_shaper.cfg]
[include Macros.cfg]
[include Addons/fan_tach_monitor.cfg]
[include homing.cfg]
[include mmu/optional/client_macros.cfg]
[include mmu/base/*.cfg]
[include mmu/macros/*.cfg]
# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)
# Happy Hare Client macros (should be after last include or other PAUSE/CANCEL macros)


[exclude_object]

#################################################
#                  MCU'S
#################################################

[mcu]      
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_450018000551323235363233-if00
restart_method: command 

[mcu CB1]
serial: /tmp/klipper_host_mcu

[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320E6F13-if00
# serial:/dev/serial/by-id/usb-Klipper_rp2040_4E363334320E96BE-if00
restart_method: command

[mcu cartographer]
serial:/dev/serial/by-id/usb-Cartographer_stm32g431xx_520026001850303655333520-if00
restart_method: command 

[force_move]
enable_force_move: True

[gcode_arcs]                       
resolution: 1.0

[idle_timeout]
gcode: SET_IDLE_TIMEOUT
timeout: 3600

###############################################
#            Temp Sensors
###############################################

[temperature_sensor Manta_M8P]         
sensor_type: temperature_mcu
min_temp:0
max_temp:100

[temperature_sensor CB1]     
sensor_type: temperature_host
min_temp: 0
max_temp: 110

[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100

[temperature_sensor chamber]
sensor_type: ATC Semitec 104NT-4-R025H42G                                                 #EPCOS 100K B57560G104F
sensor_pin: PB0

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[pause_resume]

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 3000
# max_accel_to_decel: 4500
max_z_velocity: 15
max_z_accel: 500
square_corner_velocity: 5.0

