#########################################
#             stepper x
#########################################

##  B Stepper - Left
[stepper_x]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: nhk:gpio13                                                                                #tmc2209_stepper_x: virtual_endstop  #nhk:gpio13 #PC15
position_endstop: 358
position_max: 358
homing_speed: 80  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PG14
interpolate: True  
run_current: 1.2                                     #0.8                 #1.061  #1.5                          
sense_resistor: 0.110
stealthchop_threshold: 999999
diag_pin: ^PF0
driver_sgthrs: 200  #255 most sensitive 0 is least sensitive


#######################################
#           stepper y
#######################################

##  A Stepper - Right
[stepper_y]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: PC15                                                                #tmc2209_stepper_y: virtual_endstop#PC15#PF0#nhk:gpio13 
position_endstop: 365
position_max: 365
homing_speed: 80  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PG10
interpolate: True  
run_current: 1.2                                   #0.8                       #1.061  #1.5
sense_resistor: 0.110
stealthchop_threshold: 999999
# diag_pin: ^PC15
# driver_sgthrs: 70 #255 most sensitive 0 is least sensitive


######################################
#           stepper Z
######################################

[stepper_z] #motherboard：Z3 
step_pin: PE2    
dir_pin: !PE1    
enable_pin: !PE4   
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 16                
endstop_pin: probe:z_virtual_endstop
position_max: 347             
position_min: -10              
#position_endstop: 0
homing_speed: 15.0    
homing_retract_dist: 0
homing_retract_speed: 15.0
second_homing_speed: 10.0

[tmc2209 stepper_z]
uart_pin: PE3
interpolate: true             
run_current: 0.566                    
sense_resistor: 0.110
stealthchop_threshold: 999999

######################################
#           stepper Z1
######################################

[stepper_z1] ##motherboard：Z1
step_pin:PB4  
dir_pin: PB3 
enable_pin:!PB6 
rotation_distance: 40         
gear_ratio: 80:12            
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true             
run_current: 0.566                    
sense_resistor: 0.110         
stealthchop_threshold: 999999

######################################
#           stepper Z2
######################################

[stepper_z2] ##motherboard：Z2
step_pin: PB8
dir_pin: !PB7   
enable_pin:!PE0
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 16 

[tmc2209 stepper_z2]
uart_pin: PB9
interpolate: true             
run_current: 0.566           
sense_resistor: 0.110         
stealthchop_threshold: 999999

######################################
#           stepper Z3
######################################

[stepper_z3] ##motherboard：Z4
step_pin: PE6 
dir_pin: PE5
enable_pin: !PC14  
rotation_distance: 40         
gear_ratio: 80:12             
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PC13
interpolate: true             
run_current: 0.566           
sense_resistor: 0.110         
stealthchop_threshold: 999999

#######################################
#          extruder
#######################################

[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
heater_pin: nhk:gpio9
sensor_pin: nhk:gpio29
pullup_resistor: 2200
microsteps: 16
rotation_distance:  48.02976                                       #46.617                                  #47.088 
gear_ratio: 9:1
full_steps_per_rotation: 200 
nozzle_diameter: 0.400        
filament_diameter: 1.75   
sensor_type: EPCOS 100K B57560G104F                                                  #ATC Semitec 104NT-4-R025H42G                                   #my_thermistor_e   
min_temp: -0                  
max_temp: 305                 
max_power: 1.0                
min_extrude_temp: 0
max_extrude_cross_section: 5
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 500                                                #1500
pressure_advance: 0.025       
pressure_advance_smooth_time: 0.035
#z_offset: -0.740
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114

[tmc2209 extruder]
sense_resistor: 0.110
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false                                      #false            
run_current: 0.5           
hold_current: 0.3
stealthchop_threshold: 999999

[firmware_retraction]
retract_length: 0.8
retract_speed: 40
unretract_speed: 40

